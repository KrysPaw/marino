version: '3.8'

services:
  db:
    image: postgres:15
    container_name: inva_postgres
    restart: always
    environment:
      POSTGRES_USER: inva_user
      POSTGRES_PASSWORD: inva_password
      POSTGRES_DB: inva_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: